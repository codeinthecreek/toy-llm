<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Training as descending a loss landscape</title>
<desc id="desc">A ball rolling down a bumpy surface from high loss to low loss over training steps, illustrating how gradient descent gradually reduces the model's error.</desc>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect width="680" height="300" fill="#FFFFFF"/>

<path d="M60 90 C 140 85, 180 200, 260 215 C 340 228, 420 235, 500 238 C 550 240, 590 240, 620 240" fill="none" stroke="#6B7280" stroke-width="1.5" opacity="0.5"/>

<circle cx="90" cy="94" r="7" fill="#F0997B" opacity="0.5"/>
<circle cx="220" cy="204" r="7" fill="#F0997B" opacity="0.65"/>
<circle cx="340" cy="228" r="7" fill="#F0997B" opacity="0.8"/>
<circle cx="480" cy="237" r="9" fill="#D85A30"/>

<line x1="90" y1="94" x2="90" y2="60" stroke="#9CA3AF" stroke-width="0.75" stroke-dasharray="2 3"/>
<text x="90" y="50" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4B5563">step 0</text>

<line x1="220" y1="204" x2="220" y2="180" stroke="#9CA3AF" stroke-width="0.75" stroke-dasharray="2 3"/>
<text x="220" y="170" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4B5563">step 500</text>

<line x1="480" y1="237" x2="480" y2="260" stroke="#9CA3AF" stroke-width="0.75" stroke-dasharray="2 3"/>
<text x="480" y="274" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4B5563">step 8000</text>

<text x="30" y="70" font-family="sans-serif" font-size="12" fill="#4B5563">high</text>
<text x="30" y="245" font-family="sans-serif" font-size="12" fill="#4B5563">low</text>
<line x1="55" y1="55" x2="55" y2="245" stroke="#6B7280" stroke-width="0.75" opacity="0.4" marker-end="url(#arrow)"/>
<text x="330" y="290" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4B5563">training step &#8594;</text>
</svg>
